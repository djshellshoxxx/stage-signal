name: Beta release
# Build is split into small jobs: tests run ONCE (job `test`), then every platform builds in its own job
# from that exact commit without re-running tests, then `release` publishes one prerelease.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-beta.1)"
        required: true
        default: v0.1.0-beta.2
      publish_release:
        description: "Publish the validated artifacts as a GitHub prerelease"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DSS_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  build:
    needs: test
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, cmake: "" }
          - { name: macos-arm64, os: macos-latest, cmake: "-DCMAKE_OSX_ARCHITECTURES=arm64" }
          - { name: macos-x86_64, os: macos-latest, cmake: "-DCMAKE_OSX_ARCHITECTURES=x86_64" }
          - { name: linux-x64, os: ubuntu-latest, cmake: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hendrikmuhs/ccache-action@v1.2
        with: { key: "beta-${{ matrix.name }}", max-size: 600M }
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libasound2-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build-app -G Ninja -DSS_BUILD_APP=ON -DSS_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 ${{ matrix.cmake }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build-app --target StageSignal_Standalone StageSignal_VST3 StageSignal_CLAP
      - name: Application functional self-tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN=build-app/app/StageSignal_artefacts/Release/Standalone/StageSignal
          test -x "$BIN"
          SS_DATA_DIR="$RUNNER_TEMP/stagesignal-selftests" xvfb-run -a "$BIN" --selftest all
      - name: Package
        shell: bash
        run: |
          set -e
          V="${{ inputs.tag }}"; N="StageSignal-${V}-${{ matrix.name }}"
          A=build-app/app/StageSignal_artefacts/Release
          test -s "$A/CLAP/StageSignal.clap" || test -d "$A/CLAP/StageSignal.clap"
          test -d "$A/VST3/StageSignal.vst3"
          mkdir -p dist
          python scripts/collect_release_notices.py --juce-root build-app/_deps/juce-src \
            --clap-root build-app/_deps/clap_juce_extensions-src --output build-app/release-notices
          for format in Standalone CLAP VST3; do
            case "${{ matrix.name }}" in
              macos-*)
                case "$format" in Standalone) bundle=StageSignal.app ;; CLAP) bundle=StageSignal.clap ;; VST3) bundle=StageSignal.vst3 ;; esac
                mkdir -p "$A/$format/$bundle/Contents/Resources"
                cp -R build-app/release-notices "$A/$format/$bundle/Contents/Resources/StageSignal-Notices" ;;
              *) cp -R build-app/release-notices "$A/$format/StageSignal-Notices" ;;
            esac
          done
          case "${{ matrix.name }}" in
            windows-x64)
              (cd "$A/Standalone" && 7z a -tzip "$GITHUB_WORKSPACE/dist/${N}-standalone.zip" StageSignal.exe StageSignal-Notices >/dev/null)
              (cd "$A/CLAP" && 7z a -tzip "$GITHUB_WORKSPACE/dist/${N}-clap.zip" StageSignal.clap StageSignal-Notices >/dev/null)
              (cd "$A/VST3" && 7z a -tzip "$GITHUB_WORKSPACE/dist/${N}-vst3.zip" StageSignal.vst3 StageSignal-Notices >/dev/null) ;;
            macos-*)
              codesign --force --deep -s - "$A/Standalone/StageSignal.app"
              codesign --force --deep -s - "$A/CLAP/StageSignal.clap"
              codesign --force --deep -s - "$A/VST3/StageSignal.vst3"
              (cd "$A/Standalone" && ditto -c -k --keepParent StageSignal.app "$GITHUB_WORKSPACE/dist/${N}-standalone.zip")
              (cd "$A/CLAP" && ditto -c -k --keepParent StageSignal.clap "$GITHUB_WORKSPACE/dist/${N}-clap.zip")
              (cd "$A/VST3" && ditto -c -k --keepParent StageSignal.vst3 "$GITHUB_WORKSPACE/dist/${N}-vst3.zip") ;;
            linux-x64)
              tar -C "$A/Standalone" -czf "dist/${N}-standalone.tar.gz" StageSignal StageSignal-Notices
              tar -C "$A/CLAP" -czf "dist/${N}-clap.tar.gz" StageSignal.clap StageSignal-Notices
              tar -C "$A/VST3" -czf "dist/${N}-vst3.tar.gz" StageSignal.vst3 StageSignal-Notices ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: "dist-${{ matrix.name }}", path: dist/*, if-no-files-found: error }

  release:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "dist-*", merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish prerelease
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release create "${{ inputs.tag }}" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "StageSignal ${{ inputs.tag }}" \
            --notes-file docs/RELEASE_NOTES_BETA.md
