name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    name: core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSS_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  app-linux:
    name: app compile + headless smoke (linux)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with: { key: app-linux, max-size: 600M }
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libasound2-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: |
          cmake -S . -B build-app -G Ninja -DSS_BUILD_APP=ON -DSS_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build standalone + VST3 + CLAP
        run: cmake --build build-app --target StageSignal_Standalone StageSignal_VST3 StageSignal_CLAP
      - name: Headless smoke (must stay alive 8 s without crashing)
        run: |
          BIN=$(find build-app -type f -name StageSignal -perm -u+x | head -1)
          set +e; timeout 8 xvfb-run -a "$BIN"; rc=$?; test "$rc" -eq 124

      - name: Application functional self-tests
        run: |
          BIN=build-app/app/StageSignal_artefacts/Release/Standalone/StageSignal
          test -x "$BIN"
          SS_DATA_DIR="$RUNNER_TEMP/stagesignal-selftests" xvfb-run -a "$BIN" --selftest all
